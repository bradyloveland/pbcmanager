<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backup Manager</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='6' width='26' height='20' rx='3' fill='%231D3043'/%3E%3Crect x='7' y='11' width='3' height='10' rx='1' fill='%235FB482'/%3E%3Crect x='12' y='11' width='3' height='10' rx='1' fill='%235FB482'/%3E%3Crect x='17' y='11' width='3' height='10' rx='1' fill='%23EF7A70'/%3E%3Crect x='22' y='11' width='3' height='10' rx='1' fill='%235FB482'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#E6EBEF; --surface:#FFFFFF; --surface-2:#F3F6F8; --ink:#15202B; --muted:#56636E; --line:#CFD7DE;
  --rail:#1D3043; --rail-ink:#B9C8D6; --rail-hi:#FFFFFF; --rail-sel:#2A445D;
  --accent:#2B6CA3; --accent-ink:#FFFFFF; --accent-soft:#DCE8F3;
  --ok:#2E7A4F; --ok-soft:#DDEFE3; --bad:#B3261E; --bad-soft:#F7DEDC; --warn:#96610A; --warn-soft:#F5E9D3;
  --idle:#C4CDD5; --focus:#F0A92E;
  --r-lg:10px; --r-sm:6px;
  --font: "IBM Plex Sans", "Segoe UI", Ubuntu, Cantarell, "Noto Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", "JetBrains Mono", "DejaVu Sans Mono", ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#101920; --surface:#18232D; --surface-2:#1E2B37; --ink:#E2E9EF; --muted:#94A3B0; --line:#2B3A48;
    --rail:#0B1218; --rail-ink:#8FA2B3; --rail-sel:#1A2835;
    --accent:#6FA6DA; --accent-ink:#0B1218; --accent-soft:#1D3345;
    --ok:#62B786; --ok-soft:#173327; --bad:#F07C72; --bad-soft:#3A1D1B; --warn:#E2AC4F; --warn-soft:#34291A;
    --idle:#34434F;
    color-scheme: dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.hidden{display:none!important}

/* Shell */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.rail{background:var(--rail);color:var(--rail-ink);display:flex;flex-direction:column;padding:22px 14px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px 22px;color:var(--rail-hi)}
.brand svg{flex:none}
.brand b{display:block;white-space:nowrap;font-size:16px;font-weight:650;letter-spacing:-.01em}
.brand small{display:block;color:var(--rail-ink);font-size:12.5px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{color:var(--rail-ink);text-decoration:none;padding:9px 12px;border-radius:var(--r-sm);display:flex;justify-content:space-between;align-items:center}
.nav a:hover{color:var(--rail-hi)}
.nav a[aria-current="page"]{background:var(--rail-sel);color:var(--rail-hi);font-weight:560}
.nav .count{margin-left:8px;font-size:12px;background:var(--bad);color:#fff;border-radius:10px;padding:0 7px;line-height:18px}
.rail-foot{margin-top:auto;padding:0 8px;font-size:12.5px;display:flex;flex-direction:column;gap:6px}
.rail-foot button{background:none;border:0;color:var(--rail-ink);padding:0;text-align:left;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.main{padding:34px clamp(18px,4vw,48px) 60px;max-width:1180px;width:100%}

/* Type */
h1{font-size:27px;line-height:1.2;font-weight:650;letter-spacing:-.015em;margin:0 0 6px}
h2{font-size:18px;font-weight:620;margin:0 0 12px;letter-spacing:-.005em}
h3{font-size:15px;font-weight:620;margin:0 0 4px}
.lede{color:var(--muted);margin:0 0 26px;max-width:68ch}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--mono);font-size:13px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.pagehead .lede{margin-bottom:0}
.back{display:inline-block;margin-bottom:10px;font-size:14px;text-decoration:none}
.back:hover{text-decoration:underline}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:var(--r-sm);cursor:pointer;font-weight:540;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad)}
.btn.danger:hover{border-color:var(--bad)}
.btn.small{padding:5px 10px;font-size:13.5px}
.btn:disabled{opacity:.55;cursor:default}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* Panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px}
.panel + .panel{margin-top:18px}
.banner{border-radius:var(--r-sm);padding:12px 16px;margin-bottom:20px;border:1px solid}
.banner.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.banner.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.banner code{font-family:var(--mono);font-size:13px}

/* Overview health line */
.health{display:flex;align-items:center;gap:14px;margin:0 0 28px}
.health .dot{width:14px;height:14px;border-radius:50%;flex:none;background:var(--ok);box-shadow:0 0 0 5px var(--ok-soft)}
.health.bad .dot{background:var(--bad);box-shadow:0 0 0 5px var(--bad-soft)}
.health.idle .dot{background:var(--idle);box-shadow:0 0 0 5px var(--surface-2)}
.health h1{margin:0}

/* Job ledger: the run-history strip is the signature element */
.ledger{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.ledger-head,.jobrow{display:grid;grid-template-columns:minmax(180px,1.4fr) minmax(200px,1.3fr) minmax(150px,1fr) minmax(130px,.9fr) 104px;gap:18px;align-items:center;padding:14px 20px}
.ledger-head{font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line);padding-top:11px;padding-bottom:11px;background:var(--surface-2)}
.jobrow + .jobrow{border-top:1px solid var(--line)}
.jobrow.paused{opacity:.62}
.jobname{font-weight:600;color:var(--ink);text-decoration:none}
.jobname:hover{color:var(--accent);text-decoration:underline}
.sub{font-size:13px;color:var(--muted)}
.tape{display:flex;gap:3px;align-items:flex-end;height:30px}
.tape a,.tape span{display:block;width:9px;height:24px;border-radius:2px;background:var(--idle);opacity:.45}
.tape .success{background:var(--ok);opacity:1}
.tape .failed{background:var(--bad);opacity:1;height:30px}
.tape .cancelled{background:var(--warn);opacity:.85}
.tape .running,.tape .queued{background:var(--accent);opacity:1}
.tape .running{animation:pulse 1.4s ease-in-out infinite}
.tape a:hover{outline:2px solid var(--ink);outline-offset:1px}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){.tape .running{animation:none}}
.state{display:flex;flex-direction:column;font-size:14px}
.state b{font-weight:600}
.state.success b{color:var(--ok)} .state.failed b{color:var(--bad)} .state.running b,.state.queued b{color:var(--accent)} .state.cancelled b{color:var(--warn)}
.empty{padding:44px 24px;text-align:center}
.empty p{color:var(--muted);max-width:52ch;margin:6px auto 18px}

/* Status pill */
.pill{display:inline-block;font-size:12.5px;font-weight:600;border-radius:20px;padding:1px 10px;line-height:20px}
.pill.success{background:var(--ok-soft);color:var(--ok)}
.pill.failed{background:var(--bad-soft);color:var(--bad)}
.pill.running,.pill.queued{background:var(--accent-soft);color:var(--accent)}
.pill.cancelled{background:var(--warn-soft);color:var(--warn)}

/* Tables */
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:560;color:var(--muted);font-size:12.5px;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--surface-2)}
td .summary{color:var(--muted);font-size:13px;max-width:52ch;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* Destination list */
.destlist{display:grid;gap:14px}
.dest{display:grid;grid-template-columns:1fr auto;gap:10px 18px;align-items:center}
.usage{grid-column:1/-1;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent)}

/* Forms */
form{margin:0}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 20px}
.full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:5px}
.field > span{font-weight:560;font-size:14px}
.field small,.hint{color:var(--muted);font-size:12.8px;line-height:1.4}
input[type=text],input[type=password],input[type=number],input[type=email],input[type=time],select,textarea{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;width:100%;min-width:0}
input:hover,select:hover,textarea:hover{border-color:var(--muted)}
textarea{font-family:var(--mono);font-size:13px;min-height:92px;resize:vertical}
.check{display:flex;gap:9px;align-items:flex-start;cursor:pointer}
.check input{margin-top:4px;accent-color:var(--accent)}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend{font-weight:620;font-size:16px;padding:0;margin-bottom:4px;float:left;width:100%}
legend + *{clear:both}
.section{padding:22px 0;border-top:1px solid var(--line)}
.section:first-child{border-top:0;padding-top:0}
.section > .hint{margin:0 0 14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.seg label{padding:7px 14px;cursor:pointer;border-left:1px solid var(--line);font-size:14px}
.seg label:first-child{border-left:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--accent);color:var(--accent-ink);font-weight:560}
.seg label:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:-3px}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days label{border:1px solid var(--line);border-radius:var(--r-sm);padding:5px 10px;cursor:pointer;font-size:13.5px}
.days input{position:absolute;opacity:0;pointer-events:none}
.days label:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.days label:has(input:focus-visible){outline:3px solid var(--focus)}
.shares{display:flex;flex-direction:column;gap:10px}
.share{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(120px,210px) auto;gap:8px;align-items:center}
.share-head{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(120px,210px) auto;gap:8px;font-size:12.5px;color:var(--muted)}
.iconbtn{background:none;border:1px solid transparent;border-radius:var(--r-sm);width:34px;height:34px;cursor:pointer;color:var(--muted);font-size:18px;line-height:1}
.iconbtn:hover{border-color:var(--line);color:var(--bad)}
.formfoot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:22px;border-top:1px solid var(--line);margin-top:6px}
.result{margin-top:12px;font-size:14px;padding:10px 14px;border-radius:var(--r-sm)}
.result.ok{background:var(--ok-soft);color:var(--ok)}
.result.bad{background:var(--bad-soft);color:var(--bad)}
details.adv > summary{cursor:pointer;font-weight:600;color:var(--accent);margin-bottom:4px}
details.adv[open] > summary{margin-bottom:16px}

/* Two column detail */
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:14px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;word-break:break-word}

/* Log viewer */
.log{background:#0F1720;color:#D5DEE6;font-family:var(--mono);font-size:12.8px;line-height:1.55;border-radius:var(--r-lg);padding:16px 18px;height:min(62vh,640px);overflow:auto;white-space:pre-wrap;word-break:break-word;margin:0}
.log .err{color:#FF978C}

/* Login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--rail)}
.login .panel{width:min(400px,100%);padding:30px}
.login h1{font-size:22px}
.login form{display:flex;flex-direction:column;gap:14px;margin-top:18px}

.linkbtn{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:14px}
.login-links{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.login input[name=code]{font-family:var(--mono);font-size:22px;letter-spacing:.25em;text-align:center}
.login input[name=code].recovery{font-size:17px;letter-spacing:.08em}
.status-line{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.status-line .dot{width:10px;height:10px;border-radius:50%;background:var(--idle)}
.status-line.on .dot{background:var(--ok)}
.enroll{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:start;margin-top:6px}
.qrbox{width:208px;padding:8px;background:#fff;border-radius:var(--r-sm);border:1px solid var(--line)}
.qrbox svg{display:block;width:100%;height:auto}
.secret{font-family:var(--mono);font-size:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;word-break:break-all;margin:4px 0 2px}
.steps{margin:0 0 14px;padding-left:20px}
.steps li{margin-bottom:6px}
.codes{display:grid;grid-template-columns:repeat(2,max-content);gap:6px 28px;font-family:var(--mono);font-size:15px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:14px 18px;margin:12px 0}
.subform{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
@media (max-width:760px){.enroll{grid-template-columns:1fr}}

/* Modal */
dialog{border:1px solid var(--line);border-radius:var(--r-lg);padding:0;background:var(--surface);color:var(--ink);width:min(560px,94vw);max-height:84vh}
dialog::backdrop{background:rgba(10,18,26,.5)}
.modal-head{padding:18px 20px 10px}
.modal-body{padding:0 20px;max-height:52vh;overflow:auto}
.modal-foot{padding:14px 20px 18px;display:flex;justify-content:flex-end;gap:10px;border-top:1px solid var(--line);margin-top:10px}
.crumb{font-family:var(--mono);font-size:13px;word-break:break-all;background:var(--surface-2);padding:6px 10px;border-radius:var(--r-sm);margin-top:6px}
.dirs{list-style:none;margin:0;padding:0}
.dirs button{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 6px;cursor:pointer;display:flex;gap:10px;align-items:center}
.dirs button:hover{background:var(--surface-2)}
.dirs svg{flex:none;color:var(--muted)}

/* Toasts */
#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:50}
.toast{background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:var(--r-sm);font-size:14px;max-width:380px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.toast.bad{background:var(--bad);color:#fff}
.loading{color:var(--muted);padding:30px 0}

@media (max-width:980px){
  .ledger-head{display:none}
  .jobrow{grid-template-columns:1fr auto;grid-template-areas:"name run" "tape tape" "state next";gap:10px 16px}
  .jobrow > :nth-child(1){grid-area:name} .jobrow > :nth-child(2){grid-area:tape}
  .jobrow > :nth-child(3){grid-area:state} .jobrow > :nth-child(4){grid-area:next}
  .jobrow > :nth-child(5){grid-area:run}
  .cols{grid-template-columns:1fr}
}
@media (max-width:760px){
  .shell{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;align-content:flex-start;padding:12px 14px;gap:8px}
  .brand{padding:0 8px 0 0}
  .brand small{display:none}
  .nav{flex-direction:row;overflow-x:auto;flex:1 1 100%;order:3}
  .nav a{white-space:nowrap}
  .rail-foot{margin:0 0 0 auto;flex-direction:row;gap:14px}
  .rail-foot span{display:none}
  .formgrid{grid-template-columns:1fr}
  .share,.share-head{grid-template-columns:1fr auto}
  .share-head{display:none}
  .share input.arch{grid-column:1/2}
  h1{font-size:23px}
}
</style>
</head>
<body>
<div id="login" class="login hidden">
  <div class="panel">
    <h1>Backup Manager</h1>
    <p class="muted small" id="login-host"></p>
    <form id="login-form">
      <label class="field"><span>Username</span><input type="text" name="username" autocomplete="username" required></label>
      <label class="field"><span>Password</span><input type="password" name="password" autocomplete="current-password" required></label>
      <div id="login-error" class="result bad hidden" role="alert"></div>
      <button class="btn primary" type="submit">Sign in</button>
    </form>
    <form id="totp-form" class="hidden" novalidate>
      <p class="muted small" id="totp-help" style="margin:0">Open your authenticator app and enter the 6-digit code for Backup Manager.</p>
      <label class="field"><span id="totp-label">Verification code</span>
        <input type="text" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="7" required></label>
      <div id="totp-error" class="result bad hidden" role="alert"></div>
      <button class="btn primary" type="submit">Verify</button>
      <div class="login-links">
        <button type="button" class="linkbtn" id="use-recovery">Use a recovery code instead</button>
        <button type="button" class="linkbtn" id="totp-back">Start over</button>
      </div>
    </form>
  </div>
</div>

<div id="app" class="shell hidden">
  <aside class="rail">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="6" width="26" height="20" rx="3" fill="#2A445D"/><rect x="7" y="11" width="3" height="10" rx="1" fill="#62B786"/><rect x="12" y="11" width="3" height="10" rx="1" fill="#62B786"/><rect x="17" y="11" width="3" height="10" rx="1" fill="#F07C72"/><rect x="22" y="11" width="3" height="10" rx="1" fill="#62B786"/></svg>
      <div><b>Backup Manager</b><small id="host"></small></div>
    </div>
    <nav class="nav" aria-label="Main">
      <a href="#/overview" data-nav="overview">Overview <span class="count hidden" id="fail-count"></span></a>
      <a href="#/jobs" data-nav="jobs">Backup jobs</a>
      <a href="#/destinations" data-nav="destinations">Destinations</a>
      <a href="#/activity" data-nav="activity">Activity</a>
      <a href="#/alerts" data-nav="alerts">Email alerts</a>
      <a href="#/account" data-nav="account">Account</a>
    </nav>
    <div class="rail-foot">
      <span id="version"></span>
      <button type="button" id="logout">Sign out</button>
    </div>
  </aside>
  <main class="main" id="main" tabindex="-1"></main>
</div>

<dialog id="picker">
  <div class="modal-head">
    <h2 style="margin:0">Choose a folder</h2>
    <div class="crumb" id="picker-path"></div>
  </div>
  <div class="modal-body"><ul class="dirs" id="picker-list"></ul></div>
  <div class="modal-foot">
    <button class="btn" type="button" id="picker-cancel">Cancel</button>
    <button class="btn primary" type="button" id="picker-choose">Use this folder</button>
  </div>
</dialog>

<div id="toasts" aria-live="polite"></div>

<script>
"use strict";
// Behind a reverse proxy the app may live under a sub-path like /backups/.
// All requests are relative, so make sure the page URL ends in a slash.
if (!location.pathname.endsWith("/") && !location.pathname.endsWith(".html")) {
  location.replace(location.pathname + "/" + location.search + location.hash);
}
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const main = $("#main");
const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const STATUS_WORD = {success:"Succeeded", failed:"Failed", running:"Running", queued:"Waiting", cancelled:"Cancelled"};
let pollTimer = null, routeToken = 0, session = null;

async function api(method, path, body) {
  const opts = {method, headers: {"X-PBSM": "1"}, credentials: "same-origin"};
  if (body !== undefined) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
  const res = await fetch("api" + path, opts);
  let data = {};
  try { data = await res.json(); } catch (_) {}
  if (res.status === 401 && !path.startsWith("/login")) { showLogin(); throw new Error(data.error || "Sign in to continue."); }
  if (!res.ok) throw new Error(data.error || `The server returned ${res.status}.`);
  return data;
}

function toast(msg, kind = "") {
  const el = document.createElement("div");
  el.className = "toast " + kind; el.textContent = msg;
  $("#toasts").append(el);
  setTimeout(() => el.remove(), kind === "bad" ? 7000 : 3500);
}

/* ---------- formatting ---------- */
function fmtTime(ts) {
  if (!ts) return "—";
  const d = new Date(ts * 1000), n = new Date();
  const time = d.toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
  const day = new Date(d); day.setHours(0,0,0,0);
  const today = new Date(n); today.setHours(0,0,0,0);
  const diff = Math.round((day - today) / 864e5);
  if (diff === 0) return `Today ${time}`;
  if (diff === -1) return `Yesterday ${time}`;
  if (diff === 1) return `Tomorrow ${time}`;
  return d.toLocaleDateString([], {month: "short", day: "numeric", year: d.getFullYear() !== n.getFullYear() ? "numeric" : undefined}) + " " + time;
}
function ago(ts) {
  if (!ts) return "";
  const s = Math.round(Date.now() / 1000 - ts);
  if (s < 60) return "just now";
  if (s < 3600) return `${Math.floor(s / 60)} min ago`;
  if (s < 86400) return `${Math.floor(s / 3600)} h ago`;
  return `${Math.floor(s / 86400)} d ago`;
}
function dur(a, b) {
  if (!a) return "—";
  let s = Math.max(0, Math.round((b || Date.now() / 1000) - a));
  const h = Math.floor(s / 3600); s -= h * 3600; const m = Math.floor(s / 60); s -= m * 60;
  return h ? `${h}h ${m}m` : m ? `${m}m ${s}s` : `${s}s`;
}
function bytes(n) {
  if (n == null) return "—";
  const u = ["B","KiB","MiB","GiB","TiB","PiB"]; let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return `${n.toFixed(n < 10 && i ? 1 : 0)} ${u[i]}`;
}
function schedText(s) {
  if (!s || s.type === "manual") return "Only when started by hand";
  const [hh, mm] = s.time.split(":");
  if (s.type === "hourly") return s.interval_hours === 1 ? `Every hour at :${mm}` : `Every ${s.interval_hours} hours at :${mm}`;
  const days = s.days || [];
  if (days.length === 7) return `Daily at ${s.time}`;
  if (days.join() === "0,1,2,3,4") return `Weekdays at ${s.time}`;
  if (days.join() === "5,6") return `Weekends at ${s.time}`;
  return `${days.map(d => DAYS[d]).join(", ")} at ${s.time}`;
}
const pill = st => `<span class="pill ${esc(st)}">${esc(STATUS_WORD[st] || st)}</span>`;

/* ---------- auth ---------- */
let loginTicket = null, recoveryMode = false;
function showLogin() {
  stopPoll();
  $("#app").classList.add("hidden");
  $("#login").classList.remove("hidden");
  $("#login-host").textContent = session ? `Sign in to manage backups on ${session.host}.` : "";
  resetLogin();
}
function resetLogin() {
  loginTicket = null;
  $("#totp-form").classList.add("hidden");
  $("#login-form").classList.remove("hidden");
  $("#login-error").classList.add("hidden");
  setTimeout(() => $("#login-form [name=username]").focus(), 0);
}
function setRecoveryMode(on) {
  recoveryMode = on;
  const inp = $("#totp-form [name=code]");
  inp.value = "";
  inp.classList.toggle("recovery", on);
  inp.inputMode = on ? "text" : "numeric";
  inp.maxLength = on ? 11 : 7;
  inp.autocomplete = on ? "off" : "one-time-code";
  inp.placeholder = on ? "xxxxx-xxxxx" : "";
  $("#totp-label").textContent = on ? "Recovery code" : "Verification code";
  $("#totp-help").textContent = on ? "Enter one of the recovery codes you saved when you set up two-step verification. Each code works once."
    : "Open your authenticator app and enter the 6-digit code for Backup Manager.";
  $("#use-recovery").textContent = on ? "Use my authenticator app instead" : "Use a recovery code instead";
  $("#totp-error").classList.add("hidden");
  inp.focus();
}
function showApp() {
  $("#login").classList.add("hidden");
  $("#app").classList.remove("hidden");
  $("#host").textContent = session.host;
  $("#version").textContent = `Version ${session.version}`;
}
async function finishLogin(r) {
  $("#login-form").password.value = "";
  $("#totp-form").code.value = "";
  loginTicket = null;
  session = await api("GET", "/session");
  showApp(); route();
  if (r && r.recovery_used) toast(`Signed in with a recovery code. ${r.recovery_left} left.${r.recovery_left <= 3 ? " Create new ones from Account." : ""}`, r.recovery_left <= 3 ? "bad" : "");
}
$("#login-form").addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target, err = $("#login-error");
  err.classList.add("hidden");
  const btn = $("button", f); btn.disabled = true;
  try {
    const r = await api("POST", "/login", {username: f.username.value, password: f.password.value});
    if (r.totp_required) {
      loginTicket = r.ticket;
      f.classList.add("hidden");
      $("#totp-form").classList.remove("hidden");
      setRecoveryMode(false);
      return;
    }
    await finishLogin(r);
  } catch (ex) { err.textContent = ex.message; err.classList.remove("hidden"); }
  finally { btn.disabled = false; }
});
$("#totp-form").addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target, err = $("#totp-error");
  err.classList.add("hidden");
  const btn = $("button[type=submit]", f); btn.disabled = true;
  try {
    const r = await api("POST", "/login/totp", {ticket: loginTicket, code: f.code.value});
    await finishLogin(r);
  } catch (ex) {
    if (/timed out/i.test(ex.message)) { resetLogin(); $("#login-error").textContent = ex.message; $("#login-error").classList.remove("hidden"); }
    else { err.textContent = ex.message; err.classList.remove("hidden"); f.code.select(); }
  } finally { btn.disabled = false; }
});
$("#totp-form [name=code]").addEventListener("input", e => {
  if (!recoveryMode && /^\d{6}$/.test(e.target.value.replace(/\s/g, ""))) $("#totp-form").requestSubmit();
});
$("#use-recovery").addEventListener("click", () => setRecoveryMode(!recoveryMode));
$("#totp-back").addEventListener("click", resetLogin);
$("#logout").addEventListener("click", async () => { await api("POST", "/logout").catch(() => {}); session.user = null; showLogin(); });

/* ---------- routing ---------- */
function stopPoll() { if (pollTimer) clearInterval(pollTimer); pollTimer = null; }
function poll(fn, ms) { stopPoll(); pollTimer = setInterval(() => fn().catch(() => {}), ms); }
function render(html) { main.innerHTML = html; }

const routes = [
  [/^#\/overview$/, "overview", viewOverview],
  [/^#\/jobs$/, "jobs", viewJobs],
  [/^#\/jobs\/new$/, "jobs", t => viewJobForm(null, t)],
  [/^#\/jobs\/(\w+)\/edit$/, "jobs", viewJobForm],
  [/^#\/jobs\/(\w+)$/, "jobs", viewJobDetail],
  [/^#\/destinations$/, "destinations", viewTargets],
  [/^#\/destinations\/new$/, "destinations", t => viewTargetForm(null, t)],
  [/^#\/destinations\/(\w+)$/, "destinations", viewTargetForm],
  [/^#\/activity$/, "activity", viewActivity],
  [/^#\/activity\/(\w+)$/, "activity", viewRun],
  [/^#\/alerts$/, "alerts", viewAlerts],
  [/^#\/account$/, "account", viewAccount],
];

async function route() {
  if (!session || !session.user) return;
  stopPoll();
  const token = ++routeToken;
  const hash = location.hash || "#/overview";
  const match = routes.find(([re]) => re.test(hash));
  if (!match) { location.hash = "#/overview"; return; }
  const [re, nav, fn] = match;
  $$(".nav a").forEach(a => { if (a.dataset.nav === nav) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  render(`<div class="loading">Loading…</div>`);
  try {
    await fn(...hash.match(re).slice(1), token);
  } catch (ex) {
    if (token === routeToken) render(`<div class="banner bad">${esc(ex.message)}</div>`);
  }
}
window.addEventListener("hashchange", route);

/* ---------- overview ---------- */
function tape(recent) {
  const slots = 20, runs = (recent || []).slice(0, slots).reverse();
  let html = "";
  for (let i = 0; i < slots - runs.length; i++) html += `<span aria-hidden="true"></span>`;
  for (const r of runs) {
    const when = fmtTime(r.started || r.queued_at);
    html += `<a class="${esc(r.status)}" href="#/activity/${esc(r.id)}" title="${esc(STATUS_WORD[r.status])}, ${esc(when)}" aria-label="${esc(STATUS_WORD[r.status])}, ${esc(when)}"></a>`;
  }
  return `<div class="tape">${html}</div>`;
}
function jobState(j) {
  const cur = (j.recent || [])[0];
  if (cur && (cur.status === "running" || cur.status === "queued"))
    return `<div class="state ${cur.status}"><b>${cur.status === "running" ? "Running now" : "Waiting to start"}</b><span class="sub">${cur.status === "running" ? "for " + dur(cur.started) : "queued " + ago(cur.queued_at)}</span></div>`;
  const last = j.last_finished;
  if (!last) return `<div class="state"><b>Never run</b><span class="sub">No history yet</span></div>`;
  const extra = last.status === "failed" && j.last_success_at ? `Last good ${ago(j.last_success_at)}` : ago(last.ended);
  return `<div class="state ${last.status}"><b>${STATUS_WORD[last.status]}</b><span class="sub">${esc(extra)}</span></div>`;
}
function nextText(j) {
  if (!j.enabled) return `<b>Paused</b><div class="sub">Won't run on schedule</div>`;
  if (!j.next_run) return `<b>Manual</b><div class="sub">Start it by hand</div>`;
  return `<b style="font-weight:560">${esc(fmtTime(j.next_run))}</b><div class="sub">${esc(schedText(j.schedule))}</div>`;
}
function jobRow(j) {
  const active = (j.recent || [])[0] && ["running","queued"].includes(j.recent[0].status);
  return `<div class="jobrow ${j.enabled ? "" : "paused"}">
    <div><a class="jobname" href="#/jobs/${esc(j.id)}">${esc(j.name)}</a>
      <div class="sub">${j.shares} folder${j.shares === 1 ? "" : "s"} to ${esc(j.target_name || "no destination")}</div></div>
    ${tape(j.recent)}
    ${jobState(j)}
    <div class="small">${nextText(j)}</div>
    <div style="text-align:right"><button class="btn small" data-run="${esc(j.id)}" ${active ? "disabled" : ""}>${active ? "Running" : "Run now"}</button></div>
  </div>`;
}
function bindRunButtons(refresh) {
  $$("[data-run]", main).forEach(b => b.addEventListener("click", async () => {
    b.disabled = true;
    try {
      const r = await api("POST", `/jobs/${b.dataset.run}/run`);
      toast(r.created ? "Backup started." : "That job is already running.");
      await refresh();
    } catch (ex) { toast(ex.message, "bad"); b.disabled = false; }
  }));
}
async function viewOverview(token) {
  const draw = async () => {
    const d = await api("GET", "/overview");
    if (token !== routeToken) return;
    const failing = d.jobs.filter(j => j.last_finished && j.last_finished.status === "failed");
    updateFailCount(failing.length);
    let cls = "", head;
    if (!d.jobs.length) { cls = "idle"; head = "No backup jobs yet"; }
    else if (failing.length) { cls = "bad"; head = failing.length === 1 ? `${failing[0].name} failed its last run` : `${failing.length} of ${d.jobs.length} jobs failed their last run`; }
    else if (d.jobs.every(j => !j.last_finished)) { cls = "idle"; head = "Waiting for the first backups"; }
    else head = d.jobs.length === 1 ? "Your backup job is healthy" : `All ${d.jobs.length} backup jobs are healthy`;
    const banners = [];
    if (!d.client_version) banners.push(`<div class="banner bad"><b>proxmox-backup-client isn't installed.</b> Backups can't run until it is. Re-run the installer or install the <code>proxmox-backup-client</code> package.</div>`);
    if (!d.email_enabled && d.jobs.length) banners.push(`<div class="banner warn">Email alerts are off, so a failed backup won't notify anyone. <a href="#/alerts">Set up alerts</a></div>`);
    const body = !d.jobs.length
      ? `<div class="ledger empty"><h2>Set up your first backup</h2><p>${d.target_count ? "Pick the folders to protect and when to back them up." : "Start by adding the Proxmox Backup Server you want to back up to, then create a job for your folders."}</p>
         <a class="btn primary" href="${d.target_count ? "#/jobs/new" : "#/destinations/new"}">${d.target_count ? "Create a backup job" : "Add a destination"}</a></div>`
      : `<div class="ledger">
          <div class="ledger-head"><div>Job</div><div>Last 20 runs, oldest to newest</div><div>Last result</div><div>Next run</div><div></div></div>
          ${d.jobs.map(jobRow).join("")}
        </div>`;
    render(`<div class="health ${cls}"><span class="dot"></span><h1>${esc(head)}</h1></div>${banners.join("")}${body}`);
    bindRunButtons(draw);
  };
  await draw();
  poll(draw, 5000);
}
function updateFailCount(n) {
  const el = $("#fail-count");
  el.textContent = n; el.classList.toggle("hidden", !n);
  el.setAttribute("aria-label", `${n} failing`);
}

/* ---------- jobs ---------- */

  const [{jobs}, {targets}] = await Promise.all([api("GET", "/jobs"), api("GET", "/targets")]);
  if (token !== routeToken) return;
  const tname = Object.fromEntries(targets.map(t => [t.id, t.name]));
  render(`<div class="pagehead"><div><h1>Backup jobs</h1><p class="lede">Each job backs up a set of folders to one destination on a schedule.</p></div>
    <a class="btn primary" href="#/jobs/new">Create a backup job</a></div>
    ${jobs.length ? `<div class="panel tablewrap" style="padding:6px 10px"><table>
      <thead><tr><th>Job</th><th>Folders</th><th>Destination</th><th>Schedule</th><th></th></tr></thead>
      <tbody>${jobs.map(j => `<tr class="clickable" data-href="#/jobs/${esc(j.id)}">
        <td><a class="jobname" href="#/jobs/${esc(j.id)}">${esc(j.name)}</a>${j.enabled ? "" : ` <span class="pill cancelled">Paused</span>`}<div class="sub mono">host/${esc(j.backup_id)}</div></td>
        <td class="small">${j.shares.map(s => `<div class="mono">${esc(s.path)}</div>`).join("")}</td>
        <td>${esc(tname[j.target_id] || "Missing")}</td>
        <td class="small">${esc(schedText(j.schedule))}</td>
        <td style="text-align:right"><a class="btn small" href="#/jobs/${esc(j.id)}/edit">Edit</a></td></tr>`).join("")}</tbody></table></div>`
      : `<div class="panel empty"><h2>No jobs yet</h2><p>${targets.length ? "Create a job to choose folders and a schedule." : "Add a destination first, so jobs have somewhere to back up to."}</p>
        <a class="btn primary" href="${targets.length ? "#/jobs/new" : "#/destinations/new"}">${targets.length ? "Create a backup job" : "Add a destination"}</a></div>`}`);
  $$("tr[data-href]", main).forEach(tr => tr.addEventListener("click", e => { if (!e.target.closest("a,button")) location.hash = tr.dataset.href; }));
}

async function viewJobDetail(id, token) {
  const [{jobs}, {targets}] = await Promise.all([api("GET", "/jobs"), api("GET", "/targets")]);
  const job = jobs.find(j => j.id === id);
  if (!job) throw new Error("That job doesn't exist anymore.");
  const target = targets.find(t => t.id === job.target_id);
  if (token !== routeToken) return;
  render(`<a class="back" href="#/jobs">‹ Backup jobs</a>
    <div class="pagehead"><div><h1>${esc(job.name)}</h1><p class="lede">${esc(schedText(job.schedule))}${job.enabled ? "" : ", currently paused"}.</p></div>
      <div class="btnrow"><a class="btn" href="#/jobs/${esc(id)}/edit">Edit job</a><button class="btn primary" data-run="${esc(id)}">Run now</button></div></div>
    <div class="cols">
      <div>
        <div class="panel"><h2>Recent runs</h2><div id="runs" class="tablewrap"><div class="loading">Loading…</div></div></div>
        <div class="panel"><h2>Snapshots on the server</h2><p class="hint" style="margin-top:-6px">Stored in <span class="mono">host/${esc(job.backup_id)}</span>. Restore files from the PBS web interface or with <span class="mono">proxmox-backup-client restore</span>.</p><div id="snaps"><div class="loading">Asking the server…</div></div></div>
      </div>
      <div class="panel">
        <h2>Details</h2>
        <dl class="kv">
          <dt>Destination</dt><dd>${target ? `<a href="#/destinations/${esc(target.id)}">${esc(target.name)}</a><div class="sub mono">${esc(target.repository)}</div>` : "Missing"}</dd>
          <dt>Backup ID</dt><dd class="mono">${esc(job.backup_id)}</dd>
          <dt>Folders</dt><dd>${job.shares.map(s => `<div><span class="mono">${esc(s.path)}</span><div class="sub">saved as ${esc(s.archive)}.pxar</div></div>`).join("")}</dd>
          <dt>Excluded</dt><dd>${job.excludes.length ? job.excludes.map(e => `<div class="mono">${esc(e)}</div>`).join("") : `<span class="muted">Nothing</span>`}</dd>
          <dt>Change detection</dt><dd>${esc({metadata:"Metadata (fastest)", data:"Data", legacy:"Legacy"}[job.change_detection_mode])}</dd>
          <dt>Speed limit</dt><dd>${job.rate ? esc(job.rate) + "/s" : `<span class="muted">None</span>`}</dd>
          <dt>Encryption</dt><dd>${job.keyfile ? `<span class="mono">${esc(job.keyfile)}</span>` : `<span class="muted">Not encrypted by this job</span>`}</dd>
        </dl>
      </div>
    </div>`);
  const drawRuns = async () => {
    const {runs} = await api("GET", `/runs?job=${id}&limit=25`);
    if (token !== routeToken) return;
    $("#runs").innerHTML = runsTable(runs, false);
    bindRowLinks();
    const active = runs[0] && ["running","queued"].includes(runs[0].status);
    const b = $("[data-run]", main); if (b) { b.disabled = active; b.textContent = active ? "Running" : "Run now"; }
  };
  bindRunButtons(drawRuns);
  await drawRuns();
  poll(drawRuns, 5000);
  api("GET", `/jobs/${id}/snapshots`).then(({snapshots}) => {
    if (token !== routeToken) return;
    $("#snaps").innerHTML = snapshots.length ? `<div class="tablewrap"><table><thead><tr><th>Taken</th><th>Size</th><th>Verified</th></tr></thead><tbody>
      ${snapshots.map(s => `<tr><td>${esc(fmtTime(s.time))}${s.protected ? ` <span class="pill running">Protected</span>` : ""}</td><td>${esc(bytes(s.size))}</td>
      <td>${s.verified === "ok" ? `<span class="pill success">OK</span>` : s.verified === "failed" ? `<span class="pill failed">Failed</span>` : `<span class="muted small">Not yet</span>`}</td></tr>`).join("")}
      </tbody></table></div>` : `<p class="muted">No snapshots yet. They appear here after the first successful run.</p>`;
  }).catch(ex => { if (token === routeToken) $("#snaps").innerHTML = `<div class="result bad">${esc(ex.message)}</div>`; });
}

function runsTable(runs, showJob) {
  if (!runs.length) return `<p class="muted">No runs yet.</p>`;
  return `<table><thead><tr><th>Result</th>${showJob ? "<th>Job</th>" : ""}<th>Started</th><th>Took</th><th>Details</th></tr></thead><tbody>
    ${runs.map(r => `<tr class="clickable" data-href="#/activity/${esc(r.id)}">
      <td>${pill(r.status)}</td>${showJob ? `<td><a href="#/activity/${esc(r.id)}" class="jobname">${esc(r.job_name)}</a><div class="sub">${r.trigger === "schedule" ? "Scheduled" : "Started by hand"}</div></td>` : ""}
      <td class="small">${esc(fmtTime(r.started || r.queued_at))}</td>
      <td class="small">${r.started ? esc(dur(r.started, r.ended)) : "—"}</td>
      <td><div class="summary">${esc(r.summary || (r.status === "running" ? "In progress" : ""))}</div>${r.email_error ? `<div class="sub" style="color:var(--bad)">Alert email failed: ${esc(r.email_error)}</div>` : ""}</td></tr>`).join("")}
  </tbody></table>`;
}
function bindRowLinks() {
  $$("tr[data-href]", main).forEach(tr => tr.addEventListener("click", e => { if (!e.target.closest("a,button")) location.hash = tr.dataset.href; }));
}

/* ---------- job form ---------- */

      </fieldset>

      </fieldset>
      <fieldset class="section"><legend>Schedule</legend>
        <div style="margin:12px 0 16px" class="seg" role="radiogroup" aria-label="How often">
          ${[["manual","By hand only"],["daily","On certain days"],["hourly","Every few hours"]].map(([v,l]) => `<label><input type="radio" name="stype" value="${v}" ${s.type === v ? "checked" : ""}>${l}</label>`).join("")}
        </div>
        <div id="sched-daily" class="formgrid">
          <div class="field full"><span>Days</span><div class="days">${DAYS.map((d,i) => `<label><input type="checkbox" name="day" value="${i}" ${(s.days || []).includes(i) ? "checked" : ""}>${d}</label>`).join("")}</div></div>
        </div>
        <div id="sched-hourly" class="formgrid">
          <label class="field"><span>Every</span><select name="interval">${[1,2,3,4,6,8,12].map(n => `<option value="${n}" ${s.interval_hours === n ? "selected" : ""}>${n === 1 ? "hour" : n + " hours"}</option>`).join("")}</select></label>
        </div>
        <div id="sched-time" class="formgrid" style="margin-top:16px">
          <label class="field"><span id="time-label">Start time</span><input type="time" name="time" value="${esc(s.time)}"><small id="time-hint"></small></label>
        </div>
        <p class="hint" id="sched-summary" style="margin:14px 0 0"></p>
      </fieldset>
      <fieldset class="section"><details class="adv" ${j.excludes.length || j.rate || j.keyfile || j.change_detection_mode !== "metadata" ? "open" : ""}><summary>More options</summary>
        <div class="formgrid">
          <label class="field full"><span>Skip these files and folders</span><textarea name="excludes" placeholder="lost+found&#10;**/.recycle&#10;**/*.tmp">${esc(j.excludes.join("\n"))}</textarea>
            <small>One pattern per line, relative to each folder. Use ** to match any depth.</small></label>
          <label class="field"><span>Change detection</span><select name="mode">
            <option value="metadata" ${j.change_detection_mode === "metadata" ? "selected" : ""}>Metadata: skip files whose size and time are unchanged</option>
            <option value="data" ${j.change_detection_mode === "data" ? "selected" : ""}>Data: read every file each run</option>
            <option value="legacy" ${j.change_detection_mode === "legacy" ? "selected" : ""}>Legacy: single-archive format</option></select>
            <small>Metadata is much faster for large, mostly unchanged shares.</small></label>
          <label class="field"><span>Upload speed limit</span><input type="text" name="rate" value="${esc(j.rate)}" placeholder="No limit, e.g. 20MiB"><small>Per second. Useful so backups don't saturate your internet connection.</small></label>
          <label class="field"><span>Encryption key file</span><input type="text" name="keyfile" value="${esc(j.keyfile)}" class="mono" placeholder="/root/pbs-omv.key"><small>Optional. Create one with <span class="mono">proxmox-backup-client key create</span> and keep a copy somewhere other than this machine.</small></label>
          <label class="field"><span>Key file password</span><input type="password" name="keyfile_password" autocomplete="new-password" placeholder="${job && job.keyfile_password_set ? "Saved. Leave blank to keep it" : "Only if the key has one"}"></label>
        </div></details>
      </fieldset>
      <div id="form-error" class="result bad hidden" role="alert"></div>
      <div class="formfoot">
        <div class="btnrow"><button class="btn primary" type="submit">${id ? "Save changes" : "Create job"}</button><a class="btn" href="${id ? `#/jobs/${esc(id)}` : "#/jobs"}">Cancel</a></div>
        ${id ? `<button type="button" class="btn danger" id="deljob">Delete job</button>` : ""}
      </div>
    </form>`);

  const form = $("#jobform");
  const archiveFrom = p => { const b = (p.replace(/\/+$/, "").split("/").pop() || "root").replace(/[^A-Za-z0-9_-]+/g, "-").replace(/^[-_]+|[-_]+$/g, ""); return (b || "root").slice(0, 48); };
  const drawShares = () => {
    $("#shares").innerHTML = shares.map((sh, i) => `<div class="share">
      <input type="text" class="mono" data-i="${i}" data-k="path" value="${esc(sh.path)}" placeholder="/srv/dev-disk-by-uuid-…/Media" aria-label="Folder path">
      <button type="button" class="btn small" data-browse="${i}">Browse</button>
      <input type="text" class="mono arch" data-i="${i}" data-k="archive" value="${esc(sh.archive)}" placeholder="archive name" aria-label="Archive name">
      <button type="button" class="iconbtn" data-del="${i}" aria-label="Remove folder" ${shares.length === 1 ? "disabled" : ""}>×</button></div>`).join("");
    $$("#shares input").forEach(inp => inp.addEventListener("input", () => {
      const sh = shares[inp.dataset.i];
      sh[inp.dataset.k] = inp.value;
      if (inp.dataset.k === "archive") sh.auto = false;
      if (inp.dataset.k === "path" && sh.auto) { sh.archive = archiveFrom(inp.value); inp.parentNode.querySelector(".arch").value = sh.archive; }
    }));
    $$("[data-del]").forEach(b => b.addEventListener("click", () => { shares.splice(+b.dataset.del, 1); drawShares(); }));
    $$("[data-browse]").forEach(b => b.addEventListener("click", async () => {
      const sh = shares[+b.dataset.browse];
      const picked = await pickFolder(sh.path || "/srv");
      if (picked) { sh.path = picked; if (sh.auto || !sh.archive) { sh.archive = archiveFrom(picked); sh.auto = true; } drawShares(); }
    }));
  };
  drawShares();
  $("#addshare").addEventListener("click", () => { shares.push({path: "", archive: "", auto: true}); drawShares(); $$("#shares input[data-k=path]").pop().focus(); });

  const syncSched = () => {
    const t = form.stype.value;
    $("#sched-daily").classList.toggle("hidden", t !== "daily");
    $("#sched-hourly").classList.toggle("hidden", t !== "hourly");
    $("#sched-time").classList.toggle("hidden", t === "manual");
    $("#time-label").textContent = t === "hourly" ? "Starting at" : "Start time";
    $("#time-hint").textContent = t === "hourly" ? "Runs at this minute past the hour, on hours that divide evenly by the interval." : "Uses this machine's time zone.";
    $("#sched-summary").textContent = t === "manual" ? "This job only runs when you press Run now." : "Summary: " + schedText(readSched());
  };
  const readSched = () => ({type: form.stype.value, time: form.time.value || "02:00",
    days: $$("[name=day]:checked", form).map(c => +c.value), interval_hours: +form.interval.value});
  form.addEventListener("change", syncSched);
  syncSched();

  form.addEventListener("submit", async e => {
    e.preventDefault();
    const err = $("#form-error"); err.classList.add("hidden");
    const payload = {
      name: form.name.value, target_id: form.target_id.value, backup_id: form.backup_id.value, enabled: form.enabled.checked,
      shares: shares.filter(sh => sh.path.trim()).map(sh => ({path: sh.path.trim(), archive: sh.archive.trim()})),
      schedule: readSched(), excludes: form.excludes.value, change_detection_mode: form.mode.value,
      rate: form.rate.value, keyfile: form.keyfile.value, keyfile_password: form.keyfile_password.value,
    };
    const btn = $("button[type=submit]", form); btn.disabled = true;
    try {
      const r = id ? await api("PUT", `/jobs/${id}`, payload) : await api("POST", "/jobs", payload);
      toast(id ? "Changes saved." : "Job created.");
      location.hash = `#/jobs/${r.job.id}`;
    } catch (ex) { err.textContent = ex.message; err.classList.remove("hidden"); err.scrollIntoView({block: "center"}); }
    finally { btn.disabled = false; }
  });
  if (id) $("#deljob").addEventListener("click", async () => {
    if (!confirm(`Delete “${j.name}”? Snapshots already on the server are kept.`)) return;
    try { await api("DELETE", `/jobs/${id}`); toast("Job deleted."); location.hash = "#/jobs"; }
    catch (ex) { toast(ex.message, "bad"); }
  });
}

/* ---------- folder picker ---------- */
function pickFolder(start) {
  const dlg = $("#picker");
  let current = start;
  return new Promise(resolve => {
    const load = async path => {
      $("#picker-list").innerHTML = `<li class="loading">Loading…</li>`;
      try {
        const d = await api("GET", `/browse?path=${encodeURIComponent(path)}`);
        current = d.path;
        $("#picker-path").textContent = d.path;
        const icon = `<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 3.5h5l1.5 1.5h6.5v8h-13z" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>`;
        $("#picker-list").innerHTML = (d.parent ? `<li><button type="button" data-p="${esc(d.parent)}">${icon}<span>Up one level</span></button></li>` : "") +
          (d.dirs.length ? d.dirs.map(n => `<li><button type="button" data-p="${esc((d.path === "/" ? "" : d.path) + "/" + n)}">${icon}<span class="mono">${esc(n)}</span></button></li>`).join("")
            : `<li class="muted small" style="padding:12px 6px">No folders inside this one.</li>`);
        $$("#picker-list [data-p]").forEach(b => b.addEventListener("click", () => load(b.dataset.p)));
      } catch (ex) { $("#picker-list").innerHTML = `<li class="result bad">${esc(ex.message)}</li>`; }
    };
    const done = v => { dlg.close(); $("#picker-choose").onclick = $("#picker-cancel").onclick = null; resolve(v); };
    $("#picker-choose").onclick = () => done(current);
    $("#picker-cancel").onclick = () => done(null);
    dlg.onclose = () => resolve(null);
    dlg.showModal();
    load(start);
  });
}

async function viewTargets(token) {
  const [{targets}, {jobs}] = await Promise.all([api("GET", "/targets"), api("GET", "/jobs")]);
  if (token !== routeToken) return;
  render(`<div class="pagehead"><div><h1>Destinations</h1><p class="lede">The Proxmox Backup Server datastores your jobs send backups to, with the credentials used to reach them.</p></div>
    <a class="btn primary" href="#/destinations/new">Add a destination</a></div>
    ${targets.length ? `<div class="destlist">${targets.map(t => {
      const n = jobs.filter(j => j.target_id === t.id).length;
      return `<div class="panel dest"><div><h3><a class="jobname" href="#/destinations/${esc(t.id)}">${esc(t.name)}</a></h3>
        <div class="sub mono">${esc(t.repository)}</div><div class="sub">${n ? `Used by ${n} job${n === 1 ? "" : "s"}` : "Not used by any job"}${t.fingerprint ? "" : ", no fingerprint saved"}</div></div>
        <div class="btnrow"><button class="btn small" data-check="${esc(t.id)}">Check connection</button><a class="btn small" href="#/destinations/${esc(t.id)}">Edit</a></div>
        <div class="usage hidden" id="u-${esc(t.id)}"></div></div>`;}).join("")}</div>`
      : `<div class="panel empty"><h2>No destinations yet</h2><p>Add the PBS server and datastore you created, plus the API token you made for this machine.</p><a class="btn primary" href="#/destinations/new">Add a destination</a></div>`}`);
  $$("[data-check]", main).forEach(b => b.addEventListener("click", async () => {
    const t = targets.find(x => x.id === b.dataset.check), box = $(`#u-${t.id}`);
    b.disabled = true; box.classList.remove("hidden"); box.innerHTML = "Connecting…";
    try { box.innerHTML = usageHtml(await api("POST", "/targets/test", {...t, secret: ""})); }
    catch (ex) { box.innerHTML = `<div class="result bad">${esc(ex.message)}</div>`; }
    finally { b.disabled = false; }
  }));
}
function usageHtml(r) {
  if (r.total == null) return `<div class="result ok">Connected. The datastore answered.</div>`;
  const pct = r.total ? Math.round(r.used / r.total * 100) : 0;
  return `<div class="bar"><i style="width:${pct}%"></i></div><div>Connected. ${bytes(r.used)} of ${bytes(r.total)} used (${pct}%), ${bytes(r.avail)} free.</div>`;
}

async function viewActivity(token) {
  const draw = async () => {
    const {runs} = await api("GET", "/runs?limit=200");
    if (token !== routeToken) return;
    const box = $("#act");
    if (box) { box.innerHTML = runsTable(runs, true); bindRowLinks(); }
  };
  render(`<h1>Activity</h1><p class="lede">Every backup run, newest first. Open one to read its full log.</p><div class="panel tablewrap" id="act" style="padding:6px 10px"></div>`);

async function viewRun(id, token) {
  let offset = 0, logText = "";
  render(`<a class="back" href="#/activity">‹ Activity</a>
    <div class="pagehead"><div><h1 id="run-title">Run</h1><p class="lede" id="run-sub"></p></div><div class="btnrow" id="run-actions"></div></div>
    <div id="run-summary"></div>
    <pre class="log" id="log" tabindex="0" aria-label="Backup log"></pre>`);
  const logEl = $("#log");
  const draw = async () => {
    const d = await api("GET", `/runs/${id}/log?offset=${offset}`);
    if (token !== routeToken) return;
    const r = d.run;
    $("#run-title").innerHTML = `${esc(r.job_name)} ${pill(r.status)}`;
    $("#run-sub").textContent = `${r.trigger === "schedule" ? "Scheduled" : "Started by hand"}, ${r.started ? "began " + fmtTime(r.started) + ", " + (r.ended ? "took " : "running for ") + dur(r.started, r.ended) : "waiting to start"}. Destination: ${r.target_name || "—"}.`;
    $("#run-actions").innerHTML = ["running","queued"].includes(r.status)
      ? `<button class="btn danger" id="cancel">${r.cancel_requested ? "Stopping…" : "Cancel run"}</button>`
      : `<a class="btn" href="#/jobs/${esc(r.job_id)}">View job</a>`;
    const c = $("#cancel");
    if (c) { c.disabled = !!r.cancel_requested; c.onclick = async () => { if (!confirm("Stop this backup? The partial snapshot will be discarded.")) return; c.disabled = true; try { await api("POST", `/runs/${id}/cancel`); toast("Stopping the backup."); } catch (ex) { toast(ex.message, "bad"); } }; }
    $("#run-summary").innerHTML = r.status === "failed" && r.summary ? `<div class="banner bad"><b>Why it failed:</b> ${esc(r.summary)}</div>`
      : r.email_error ? `<div class="banner warn">The alert email couldn't be sent: ${esc(r.email_error)}</div>` : "";
    if (d.text) {
      const atBottom = logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 40;
      if (d.truncated) logText = "… earlier output trimmed …\n";
      logText += d.text; offset = d.offset;
      logEl.innerHTML = esc(logText).replace(/^.*\berror\b.*$/gim, m => `<span class="err">${m}</span>`);
      if (atBottom) logEl.scrollTop = logEl.scrollHeight;
    } else if (!logText) logEl.textContent = r.status === "queued" ? "Waiting for another backup to finish…" : "No output.";
    if (d.done) stopPoll();
  };
  await draw();
  poll(draw, 2000);
}

function codesBlock(codes) {
  return `<p>Save these recovery codes somewhere safe, like a password manager. Each one signs you in once if you lose your phone. <b>They won't be shown again.</b></p>
    <div class="codes">${codes.map(c => `<span>${esc(c)}</span>`).join("")}</div>
    <div class="btnrow"><button type="button" class="btn small" id="codes-copy">Copy codes</button><button type="button" class="btn small" id="codes-dl">Download as a text file</button><button type="button" class="btn primary small" id="codes-done">I've saved them</button></div>`;
}
function bindCodes(codes, done) {
  const text = `Backup Manager recovery codes for ${session.host}\nEach code can be used once.\n\n${codes.join("\n")}\n`;
  $("#codes-copy").onclick = async () => { try { await navigator.clipboard.writeText(text); toast("Recovery codes copied."); } catch (_) { toast("Couldn't copy. Select the codes and copy them by hand.", "bad"); } };
  $("#codes-dl").onclick = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], {type: "text/plain"}));
    a.download = `backup-manager-recovery-codes-${session.host}.txt`;
    document.body.append(a); a.click(); a.remove();
  };
  $("#codes-done").onclick = done;
}

async function viewAccount(token) {
  const [o, firstAcct] = await Promise.all([api("GET", "/overview"), api("GET", "/account")]);
  let acct = firstAcct;
  if (token !== routeToken) return;
  render(`<h1>Account</h1><p class="lede">Signed in as <b id="acct-user">${esc(acct.username)}</b> on ${esc(session.host)}.</p>
    <div class="panel" id="twofa"></div>
    <form id="uform" class="panel" novalidate>
      <h2>Username</h2>
      <div class="formgrid">
        <label class="field"><span>New username</span><input type="text" name="username" value="${esc(acct.username)}" autocomplete="username"></label>
        <label class="field"><span>Current password</span><input type="password" name="password" autocomplete="current-password"></label>
      </div>
      <div id="u-result"></div>
      <div class="formfoot"><button class="btn primary" type="submit">Change username</button></div>
    </form>
    <form id="pform" class="panel" novalidate>
      <h2>Password</h2>
      <div class="formgrid">
        <label class="field full" style="max-width:420px"><span>Current password</span><input type="password" name="current" autocomplete="current-password"></label>
        <label class="field"><span>New password</span><input type="password" name="new" autocomplete="new-password"><small>At least 10 characters.</small></label>
        <label class="field"><span>Repeat new password</span><input type="password" name="again" autocomplete="new-password"></label>
      </div>
      <div id="p-result"></div>
      <div class="formfoot"><button class="btn primary" type="submit">Change password</button></div>
    </form>
    <div class="panel"><h2>This machine</h2><dl class="kv">
      <dt>Backup client</dt><dd>${o.client_version ? `proxmox-backup-client ${esc(o.client_version)}` : `<span style="color:var(--bad)">Not installed</span>`}</dd>
      <dt>Manager version</dt><dd>${esc(session.version)}</dd>
      <dt>Settings file</dt><dd class="mono">/etc/pbs-manager/config.json</dd>
      <dt>Service log</dt><dd class="mono">journalctl -u pbs-manager</dd>
      <dt>Locked out?</dt><dd>On the server, <span class="mono">sudo pbs-manager passwd</span> resets the password and <span class="mono">sudo pbs-manager totp-reset</span> turns off two-step verification.</dd>
    </dl></div>`);

  const box = $("#twofa");
  const drawTwofa = a => {
    acct = a;
    if (!a.totp_enabled) {
      box.innerHTML = `<h2>Two-step verification</h2>
        <div class="status-line"><span class="dot"></span><span><b>Off.</b> Signing in only needs your password.</span></div>
        <p class="hint" style="margin:0 0 14px">Turn this on to also require a 6-digit code from an authenticator app such as Aegis, 2FAS, Google Authenticator, Microsoft Authenticator, 1Password or Bitwarden.</p>
        <button class="btn primary" id="tf-start">Set up two-step verification</button><div id="tf-flow"></div>`;
      $("#tf-start").onclick = () => {
        $("#tf-start").classList.add("hidden");
        $("#tf-flow").innerHTML = `<form class="subform" id="tf-pw" novalidate>
          <label class="field" style="max-width:360px"><span>Confirm your password to continue</span><input type="password" name="password" autocomplete="current-password"></label>
          <div class="tf-err"></div>
          <div class="btnrow" style="margin-top:12px"><button class="btn primary" type="submit">Continue</button><button class="btn" type="button" id="tf-cancel">Cancel</button></div></form>`;
        $("#tf-cancel").onclick = () => drawTwofa(acct);
        $("#tf-pw [name=password]").focus();
        $("#tf-pw").onsubmit = async e => {
          e.preventDefault();
          try { showEnroll(await api("POST", "/account/totp/setup", {password: e.target.password.value})); }
          catch (ex) { $(".tf-err", e.target).innerHTML = `<div class="result bad">${esc(ex.message)}</div>`; }
        };
      };
    } else {
      box.innerHTML = `<h2>Two-step verification</h2>
        <div class="status-line on"><span class="dot"></span><span><b>On.</b> Signing in needs your password and a code from your authenticator app.</span></div>
        <p class="hint" style="margin:0 0 14px">${a.recovery_left} recovery code${a.recovery_left === 1 ? "" : "s"} left.${a.recovery_left <= 3 ? " Create new ones soon so you don't get locked out." : ""}</p>
        <div class="btnrow"><button class="btn" data-act="recovery">Create new recovery codes</button><button class="btn danger" data-act="disable">Turn off</button></div>
        <div id="tf-flow"></div>`;
      $$("[data-act]", box).forEach(b => b.onclick = () => {
        const disable = b.dataset.act === "disable";
        $("#tf-flow").innerHTML = `<form class="subform" novalidate>
          <p class="hint" style="margin:0 0 12px">${disable ? "Turning this off means only your password protects this machine's backups and credentials." : "Your existing recovery codes will stop working."}</p>
          <div class="formgrid">
            <label class="field"><span>Current password</span><input type="password" name="password" autocomplete="current-password"></label>
            <label class="field"><span>Authenticator or recovery code</span><input type="text" name="code" inputmode="numeric" autocomplete="one-time-code" class="mono"></label>
          </div>
          <div class="tf-err"></div>
          <div class="btnrow" style="margin-top:14px"><button class="btn ${disable ? "danger" : "primary"}" type="submit">${disable ? "Turn off two-step verification" : "Create new codes"}</button><button class="btn" type="button" id="tf-cancel">Cancel</button></div></form>`;
        const f = $("#tf-flow form");
        $("#tf-cancel").onclick = () => drawTwofa(acct);
        f.password.focus();
        f.onsubmit = async e => {
          e.preventDefault();
          try {
            const r = await api("POST", `/account/totp/${disable ? "disable" : "recovery"}`, {password: f.password.value, code: f.code.value});
            if (disable) { toast("Two-step verification is off."); drawTwofa(r); }
            else { $("#tf-flow").innerHTML = `<div class="subform">${codesBlock(r.recovery_codes)}</div>`; bindCodes(r.recovery_codes, () => drawTwofa(r)); }
          } catch (ex) { $(".tf-err", f).innerHTML = `<div class="result bad" style="margin-top:12px">${esc(ex.message)}</div>`; }
        };
      });
    }
  };
  const showEnroll = d => {
    $("#tf-flow").innerHTML = `<div class="subform enroll">
      <div class="qrbox">${d.qr_svg}</div>
      <form id="tf-verify" novalidate>
        <ol class="steps">
          <li>In your authenticator app, add an account and scan this QR code.</li>
          <li>Can't scan it? Enter this key instead (time-based, 6 digits):<div class="secret">${esc(d.secret)}</div></li>
          <li>Type the 6-digit code the app shows to confirm it's working.</li>
        </ol>
        <label class="field" style="max-width:220px"><span>Code from the app</span><input type="text" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="7" class="mono" style="font-size:18px;letter-spacing:.2em"></label>
        <div class="tf-err"></div>
        <div class="btnrow" style="margin-top:14px"><button class="btn primary" type="submit">Turn on two-step verification</button><button class="btn" type="button" id="tf-cancel">Cancel</button></div>
      </form></div>`;
    $("#tf-cancel").onclick = () => drawTwofa(acct);
    const f = $("#tf-verify");
    f.code.focus();
    f.onsubmit = async e => {
      e.preventDefault();
      try {
        const r = await api("POST", "/account/totp/enable", {code: f.code.value});
        box.innerHTML = `<h2>Two-step verification</h2>
          <div class="status-line on"><span class="dot"></span><span><b>On.</b> Other signed-in sessions were signed out.</span></div>
          <div class="subform">${codesBlock(r.recovery_codes)}</div>`;
        bindCodes(r.recovery_codes, () => drawTwofa(r));
      } catch (ex) { $(".tf-err", f).innerHTML = `<div class="result bad" style="margin-top:12px">${esc(ex.message)}</div>`; f.code.select(); }
    };
  };
  drawTwofa(acct);

  const uf = $("#uform");
  uf.addEventListener("submit", async e => {
    e.preventDefault(); $("#u-result").innerHTML = "";
    try {
      const r = await api("PUT", "/account/username", {username: uf.username.value, password: uf.password.value});
      uf.password.value = ""; session.user = r.username; $("#acct-user").textContent = r.username;
      $("#u-result").innerHTML = `<div class="result ok">Username changed. Use “${esc(r.username)}” next time you sign in.</div>`;
    } catch (ex) { $("#u-result").innerHTML = `<div class="result bad">${esc(ex.message)}</div>`; }
  });
  const form = $("#pform"), out = $("#p-result");
  form.addEventListener("submit", async e => {
    e.preventDefault(); out.innerHTML = "";
    if (form.new.value !== form.again.value) { out.innerHTML = `<div class="result bad">The new passwords don't match.</div>`; return; }
    try { await api("POST", "/account/password", {current: form.current.value, new: form.new.value}); form.reset(); out.innerHTML = `<div class="result ok">Password changed. Other sessions were signed out.</div>`; }
    catch (ex) { out.innerHTML = `<div class="result bad">${esc(ex.message)}</div>`; }
  });
}

/* ---------- boot ---------- */
(async () => {
  try {
    session = await api("GET", "/session");
    if (session.setup_needed) {
      $("#login").classList.remove("hidden");
      $("#login .panel").innerHTML = `<h1>Set an admin password</h1><p class="muted">Run this on ${esc(session.host)}, then reload this page:</p><pre class="log" style="height:auto">sudo pbs-manager passwd</pre>`;
      return;
    }
    if (session.user) { showApp(); route(); } else showLogin();
  } catch (ex) {
    document.body.innerHTML = `<div class="banner bad" style="margin:30px">Can't reach the Backup Manager service: ${esc(ex.message)}</div>`;
  }
})();
</script>
</body>
</html>
