name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -t .

      - name: Check the tag matches the app version
        run: |
          version=$(python3 scripts/release_tools.py version)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match VERSION ${version} in app.py"
            exit 1
          fi

      - name: Build the package
        run: python3 scripts/release_tools.py package "${GITHUB_REF_NAME#v}" dist

      - name: Write release notes from CHANGELOG.md
        run: python3 scripts/release_tools.py notes "${GITHUB_REF_NAME#v}" > notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/*.sha256 \
            --title "PBS Backup Manager ${GITHUB_REF_NAME}" --notes-file notes.md
