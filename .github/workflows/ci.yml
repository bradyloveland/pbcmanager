name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: Tests
        run: go test -race ./...

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -x install.sh uninstall.sh scripts/*.sh internal/clients/setup.sh

  clients:
    # Sets up real Debian and Ubuntu machines (containers with an SSH
    # server) as clients: installs proxmox-backup-client from Proxmox, creates
    # the pbcm account and sudo rule, browses, repairs and uninstalls.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: "debian:trixie", user: root}
          - {image: "debian:bookworm", user: root}
          - {image: "debian:bullseye", user: root}
          - {image: "ubuntu:24.04", user: alice, extra: sudo, expect: "static build"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Start the client container
        env:
          IMAGE: ${{ matrix.image }}
          EXTRA: ${{ matrix.extra }}
          SETUP_USER: ${{ matrix.user }}
        run: |
          docker run -d --name client -p 127.0.0.1:2222:22 -e EXTRA -e SETUP_USER "$IMAGE" bash -c '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -q
            apt-get install -y -q --no-install-recommends openssh-server systemd $EXTRA
            mkdir -p /run/sshd
            echo "root:ci-root-password" | chpasswd
            sed -i "s/^#\?PermitRootLogin.*/PermitRootLogin yes/" /etc/ssh/sshd_config
            if [ "$SETUP_USER" != root ]; then
              useradd -m -s /bin/bash "$SETUP_USER"
              echo "$SETUP_USER:ci-root-password" | chpasswd
              usermod -aG sudo "$SETUP_USER"
            fi
            exec /usr/sbin/sshd -D -e'
          for i in $(seq 1 120); do
            if ssh-keyscan -p 2222 127.0.0.1 >/dev/null 2>&1; then echo "SSH is up"; exit 0; fi
            sleep 2
          done
          docker logs client; exit 1
      - name: Set up the client
        env:
          PBCM_IT_ADDR: 127.0.0.1:2222
          PBCM_IT_USER: ${{ matrix.user }}
          PBCM_IT_PASSWORD: ci-root-password
          PBCM_IT_EXPECT: ${{ matrix.expect }}
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o "$RUNNER_TEMP/pbcm-runner" ./cmd/pbcm-runner
          PBCM_IT_RUNNER="$RUNNER_TEMP/pbcm-runner" go test -count=1 -v -run TestRealClient ./internal/clients/
      - name: Container log
        if: failure()
        run: docker logs client | tail -50

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build release archives
        run: make dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  install:
    # Installs the real package with systemd, checks it serves, upgrades it in
    # place and removes it again.
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Unpack
        run: |
          cd dist && sha256sum -c SHA256SUMS
          tar -xzf pbcm-*-linux-amd64.tar.gz
      - name: Install
        run: |
          cd dist/pbcm-*-linux-amd64
          sudo ./install.sh --skip-client | tee install.log
          grep -q "Setup code:" install.log
          test -x /opt/pbcm/pbcm-runner
      - name: Serves HTTPS and asks for setup
        run: |
          curl -fsk https://127.0.0.1:8099/api/health
          curl -fsk https://127.0.0.1:8099/api/session | grep -q '"setup_needed":true'
          code=$(sudo pbcm setup-code)
          curl -fsk https://127.0.0.1:8099/api/setup -H 'X-PBCM: 1' -H 'Content-Type: application/json' \
            -d "{\"code\":\"$code\",\"username\":\"admin\",\"password\":\"ci-password-123\"}" | grep -q '"user":"admin"'
          systemctl show -p User --value pbcm | grep -qx pbcm
          test "$(sudo stat -c %U /var/lib/pbcm/pbcm.db)" = pbcm
      - name: Upgrade in place keeps settings
        run: |
          cd dist/pbcm-*-linux-amd64
          sudo ./install.sh --skip-client --port 9443 | tee upgrade.log
          if grep -q "Setup code:" upgrade.log; then echo "setup code shown again after setup"; exit 1; fi
          curl -fsk https://127.0.0.1:9443/api/session | grep -q '"setup_needed":false'
      - name: Uninstall
        run: |
          cd dist/pbcm-*-linux-amd64
          sudo ./uninstall.sh --purge
          if systemctl is-active --quiet pbcm; then echo "service still running"; exit 1; fi
          if id pbcm 2>/dev/null; then echo "account still there"; exit 1; fi
          test ! -e /var/lib/pbcm
          test ! -e /opt/pbcm
      - name: Service log
        if: failure()
        run: sudo journalctl -u pbcm --no-pager -n 100
